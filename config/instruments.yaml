# Instruments configuration
# Each instrument defines: timeframes used, target_points, sessions, pip_value, and contract_size

instruments:
  XAUUSD:
    description: "Gold / US Dollar"
    symbol: "XAUUSD"
    bias_timeframes: ["D1", "H4", "H1"]
    setup_timeframes: ["H1", "M15"]
    entry_timeframe: "M1"
    target_points: 10
    max_spread_points: 5
    sessions:
      london:
        start: "07:00"
        end: "16:00"
      new_york:
        start: "13:00"
        end: "21:00"
    digits: 2
    pip_value: 0.1
    contract_size: 100.0   # 1 lot = 100 oz ($100 per $1.00 move)
    lot_step: 0.01
    min_lot: 0.01

