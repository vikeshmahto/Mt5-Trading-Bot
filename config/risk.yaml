# Risk management configuration

position_sizing:
  # Risk per trade as a fraction of account balance
  risk_per_trade: 0.01          # 1% of account per trade
  # Maximum total risk across all open positions
  max_total_risk: 0.05          # 5% of account max concurrent

limits:
  # Maximum number of simultaneously open trades (all instruments combined)
  max_concurrent_trades: 3
  # Maximum number of trades per instrument at one time
  max_trades_per_instrument: 1
  # Maximum number of trades in the same direction (correlated exposure limit)
  max_concurrent_same_direction_trades: 2
  # Stop trading for the day after this loss (fraction of daily starting balance)
  max_daily_loss: 0.03          # 3% daily drawdown kill-switch
  # Maximum drawdown before full system stop
  max_drawdown: 0.10            # 10% drawdown stop

scoring:
  # Confluence score window (Model A fresh setups: Tier 70-79 only)
  min_score_to_trade: 70.0
  max_score_to_trade: 79.9   # Blocks Tier 80-100 late-stage exhaustion
  # Minimum R:R ratio required
  min_rr_ratio: 1.5

backtest:
  # Simulated slippage in points
  slippage_points: 2
  # Commission per lot per side (in account currency)
  commission_per_lot: 7.0
  # Starting balance for backtest simulation
  initial_balance: 10000.0
